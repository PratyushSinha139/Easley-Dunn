# Builds the backend and frontend images and pushes them to GitHub's container
# registry (ghcr.io). CI runs first; if it fails, nothing is built.
#
# Image tags:
#   git tag v0.1.0 + push   ->  ghcr.io/<owner>/cerberus_{api,web}:v0.1.0   (release; the server deploys these)
#   "Run workflow" by hand   ->  ghcr.io/<owner>/cerberus_{api,web}:sha-1bd4e2e  (test build; never deployed)
# <owner> is the repository owner, lowercased. No "latest" tag is ever pushed.
#
# Needs one repository variable (Settings > Secrets and variables > Actions >
# Variables): REACT_APP_API_URL, the address the browser uses to reach the API.
# Each repo sets its own value, so this file is the same in test and production.

name: Release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default. Only build-and-push gets write access to ghcr.io, so
# the npm packages installed by the ci job can never publish an image.
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    permissions:
      contents: read
      packages: write # lets GITHUB_TOKEN push to ghcr.io; no secret needed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - image: cerberus_api
            context: backend
            build-args: ""
          - image: cerberus_web
            context: frontend
            # Baked into the frontend at build time; changing it later needs a new release.
            build-args: REACT_APP_API_URL=${{ vars.REACT_APP_API_URL }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Without it the frontend silently falls back to http://localhost:5000.
      - name: Check the API URL is set
        if: matrix.image == 'cerberus_web'
        env:
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
        run: |
          if [ -z "$REACT_APP_API_URL" ]; then
            echo "::error::Repository variable REACT_APP_API_URL is not set."
            exit 1
          fi

      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{raw}}
            type=sha,enable=${{ github.event_name != 'push' }}
          flavor: |
            latest=false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          # TODO(platform): confirm with Hitesh that `uname -m` on the server is x86_64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          # One image per tag, with no attestation manifests alongside it, so
          # old versions can be deleted by hand in ghcr.io without breaking a
          # tagged image. Revisit when supply-chain attestations are added.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Summary
        env:
          IMAGE: ${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### $IMAGE"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
